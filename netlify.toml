# Netlify Configuration for PENNY Storefront

[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Proxy all backend API requests to the live Render Node.js backend
[[redirects]]
  from = "/api/*"
  to = "https://penny-kbrh.onrender.com/api/:splat"
  status = 200
  force = true

# Fallback for Single-Page Application (SPA) routing (Shop, Account, Admin, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

